<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d5c3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Parent Portal – TPS Hostel IRP</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="alternate icon" type="image/png" href="logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="variables.css?v=2.0">
  <link rel="stylesheet" href="base.css?v=2.0">
  <link rel="stylesheet" href="components.css?v=2.0">
  <link rel="stylesheet" href="responsive.css?v=2.0">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header" style="background: rgba(255,255,255,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50;">
      <div style="display: flex; align-items: center; gap: 0.85rem;">
        <img src="logo.svg" onerror="this.src='logo.png'" style="width: 38px; height: 38px; object-fit: contain;" alt="Logo">
        <div>
          <h1 style="font-size: 1.1rem; font-weight: 800; color: var(--primary-800); margin: 0;">PARENT PORTAL</h1>
          <p style="font-size: 0.75rem; color: var(--text-muted); margin: 0;">Thaiba Public School Hostel Family Desk</p>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 1rem;">
        <div style="display: flex; align-items: center; gap: 0.65rem;">
          <img id="parent-user-avatar" src="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-600);" alt="Avatar">
          <div class="hide-mobile">
            <strong id="parent-user-name" style="font-size: 0.88rem; color: var(--text-primary); display: block;">Parent</strong>
            <span id="parent-user-role" style="font-size: 0.72rem; color: var(--primary-700);">Family Access</span>
          </div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="window.Auth.logout()" style="border-radius: 10px; font-weight: 700;">
          Sign Out
        </button>
      </div>
    </header>

    <!-- Sub-Navbar for Parent Tabs -->
    <nav style="background: var(--bg-surface); border-bottom: 1px solid var(--border-color); padding: 0.5rem 1.5rem; display: flex; gap: 0.5rem; overflow-x: auto;">
      <button class="parent-nav-btn btn btn-sm btn-primary active" data-tab="my_children" onclick="Parent.setTab('my_children')">
        My Children
      </button>
      <button class="parent-nav-btn btn btn-sm btn-ghost" data-tab="request_leave" onclick="Parent.setTab('request_leave')">
        Apply for Leave
      </button>
      <button class="parent-nav-btn btn btn-sm btn-ghost" data-tab="leave_status" onclick="Parent.setTab('leave_status')">
        Leave Passes & Status
      </button>
      <button class="parent-nav-btn btn btn-sm btn-ghost" data-tab="fines_conduct" onclick="Parent.setTab('fines_conduct')">
        Fines & Conduct
      </button>
      <button class="parent-nav-btn btn btn-sm btn-ghost" data-tab="notices" onclick="Parent.setTab('notices')">
        Announcements
      </button>
    </nav>

    <!-- Main View Container -->
    <main class="main-content" style="padding: 1.5rem; max-width: 1200px; margin: 0 auto;">
      <div id="parent-view-container"></div>
    </main>
  </div>

  <div id="toast-container"></div>

  <!-- Orderly Scripts Loading -->
  <script src="config.js?v=2.0"></script>
  <script src="supabase-client.js?v=2.0"></script>
  <script src="auth.js?v=2.0"></script>
  <script src="parent-view.js?v=2.0"></script>
</body>
</html>
